<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Fraksis &mdash; Independent software studio</title>
    <meta
      name="description"
      content="Fraksis is an independent software studio in Riga engineering modern web platforms with Vue, Laravel, and TypeScript."
    />
    <meta
      name="keywords"
      content="software studio, full-stack development, Vue 3, Laravel, TypeScript, product engineering, interface design, Riga, Latvia"
    />
    <meta name="author" content="Fraksis" />
    <meta name="theme-color" content="#0a0b0e" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fraksis.com/" />
    <meta property="og:title" content="Fraksis &mdash; Independent software studio" />
    <meta
      property="og:description"
      content="We design and ship production-grade web platforms for teams who care about typography, performance, and craft."
    />
    <meta property="og:image" content="https://fraksis.com/images/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fraksis.com/" />
    <meta property="twitter:title" content="Fraksis &mdash; Independent software studio" />
    <meta
      property="twitter:description"
      content="We design and ship production-grade web platforms for teams who care about typography, performance, and craft."
    />
    <meta property="twitter:image" content="https://fraksis.com/images/og-image.jpg" />

    <!-- Preload Critical Resources -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      as="style"
    />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      as="style"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Fraksis",
        "url": "https://fraksis.com",
        "logo": "https://fraksis.com/images/logo.png",
        "description": "Independent software studio designing and engineering modern web products with Vue, Laravel, and TypeScript.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "LV"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "contact@fraksis.com"
        },
        "sameAs": ["https://github.com/AleksisVejs", "https://github.com/22DPVEmer"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
