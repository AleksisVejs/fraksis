<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #010103; overflow: hidden; position: relative; font-family: 'Space Grotesk', sans-serif; }
  .grid-line { position: absolute; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, rgba(120,140,135,.13) 20%, rgba(120,140,135,.13) 80%, transparent); }
  .diag { position: absolute; top: -80px; right: 150px; width: 3px; height: 900px; background: linear-gradient(to bottom, transparent, #e74c3c 30%, #ff5544 55%, transparent); transform: rotate(24deg); box-shadow: 0 0 42px rgba(231,76,60,.55); }
  .diag2 { position: absolute; top: -80px; right: 138px; width: 14px; height: 900px; background: linear-gradient(to bottom, transparent, rgba(231,76,60,.28) 40%, transparent); transform: rotate(24deg); filter: blur(9px); }
  .ring { position: absolute; width: 620px; height: 620px; border-radius: 50%; border: 1px solid rgba(74,222,128,.09); top: 50%; left: 26%; transform: translate(-50%,-50%); }
  .ring::before { content: ''; position: absolute; inset: 44px; border-radius: 50%; border: 1px solid rgba(74,222,128,.06); }
  .wrap { position: absolute; inset: 0; padding: 84px 96px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 19px; color: #4ade80; letter-spacing: .3em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 14px #4ade80; }
  h1 { font-size: 128px; font-weight: 700; line-height: .9; letter-spacing: -.045em; color: #ecf0f0; }
  h1 .outline { color: transparent; -webkit-text-stroke: 2.5px #35c46a; filter: drop-shadow(0 0 26px rgba(74,222,128,.35)); }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 21px; color: #8fa0a0; letter-spacing: .06em; line-height: 1.75; }
  .tag .g { color: #4ade80; }
  .tag .r { color: #e74c3c; }
  .term { font-family: 'JetBrains Mono', monospace; font-size: 18px; background: rgba(13,17,16,.92); border: 1px solid rgba(70,80,78,.5); padding: 22px 28px; line-height: 2; color: #8fa0a0; }
  .p { color: #5c6a68; }
  .cur { display: inline-block; width: 11px; height: 20px; background: #4ade80; vertical-align: middle; }
</style>
</head>
<body>
  <div class="grid-line" style="top:33%"></div>
  <div class="grid-line" style="top:66%"></div>
  <div class="ring"></div>
  <div class="diag2"></div>
  <div class="diag"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> Full-Stack Developer · Rīga, Latvia</div>
    <h1>Aleksis <span class="outline">Vējš.</span></h1>
    <div class="bottom">
      <div class="tag"><span class="g">fraksis</span> — my software identity<br>Vue <span class="r">·</span> Laravel <span class="r">·</span> Node.js</div>
      <div class="term">
        <span class="p">$ </span><span style="color:#4ade80">whoami</span><br>
        aleksis.vejs <span class="p">// open to new projects</span><br>
        <span class="p">$ </span><span class="cur"></span>
      </div>
    </div>
  </div>
</body>
</html>
